[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durian-ood"
version = "1.0.0"
description = "Compression stress test, quality-aware augmentation and decision rules for out-of-scope rejection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10.0", "torch>=2.11"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
